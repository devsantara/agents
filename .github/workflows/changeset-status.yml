name: Changeset status

on:
  pull_request_target:

permissions: {} # each job declares only the permissions it needs

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

# pull_request_target runs with access to the base repo. These jobs only check
# out and read the PR's files; never add a step that executes code from it.
jobs:
  pr-status:
    name: Generate status
    # The release PR never has changesets
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read # to check out repo (actions/checkout)
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Generate PR status
        id: pr-status
        uses: changesets/action/pr-status@v2.1.2

  pr-comment:
    name: Comment on PR
    needs: pr-status
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write # to create and update comments on PRs (changesets/action/pr-comment)
    steps:
      - name: Comment on PR
        uses: changesets/action/pr-comment@v2.1.2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
